name: Release

# 本机（./Build/publish-local.sh）是正式发版主路径；本工作流只作兜底 / 复核：
# - push 标签触发时，若该 Release 已由本机发布，则整体跳过（幂等，不重复构建、不覆盖资产）。
# - 手动 workflow_dispatch 可指定 tag 完整补发；不填 tag 则只构建上传 artifact。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: '补发版本标签（如 v0.4.2）；留空只构建产物不发布'
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 本机已发布则跳过 CI 兜底
        id: gate
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "本机已发布 $RELEASE_TAG，CI 兜底路径跳过（不重复构建、不覆盖资产）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 工具链版本
        if: steps.gate.outputs.skip != 'true'
        run: |
          swift --version
          xcodebuild -version

      - name: 导入固定自签名身份
        if: steps.gate.outputs.skip != 'true'
        env:
          DECK_SIGN_P12_BASE64: ${{ secrets.DECK_SIGN_P12_BASE64 }}
          DECK_SIGN_P12_PASSWORD: ${{ secrets.DECK_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${DECK_SIGN_P12_BASE64:-}" ]]; then
            echo "缺少 Secret：DECK_SIGN_P12_BASE64"; exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/deck-signing.keychain-db"
          security create-keychain -p "$DECK_SIGN_P12_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$DECK_SIGN_P12_PASSWORD" "$KEYCHAIN"
          echo "$DECK_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/deck-signing.p12"
          security import "$RUNNER_TEMP/deck-signing.p12" -k "$KEYCHAIN" -P "$DECK_SIGN_P12_PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$DECK_SIGN_P12_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security find-identity -v -p codesigning

      - name: 标签与 Info.plist 版本一致
        if: env.RELEASE_TAG != '' && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG#v}"
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Build/Info.plist)
          if [[ "$TAG" != "$PLIST" ]]; then
            echo "标签 $TAG 与 Build/Info.plist 的 $PLIST 不一致"; exit 1
          fi

      - name: 构建 universal 发布包
        if: steps.gate.outputs.skip != 'true'
        run: ./Build/package-release.sh universal

      - name: 生成 appcast（EdDSA 签名）
        if: steps.gate.outputs.skip != 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]]; then
            echo "缺少 Secret：SPARKLE_ED_PRIVATE_KEY"; exit 1
          fi
          echo "$SPARKLE_ED_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/sparkle_ed_key"
          chmod 600 "$RUNNER_TEMP/sparkle_ed_key"
          export DECK_ED_KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
          PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG:-${GITHUB_REF_NAME}}/"
          ./Build/make-appcast.sh BuildOutput/release/universal "$PREFIX"

      - name: 校验产物
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          APP=BuildOutput/release/universal/MacAppControlDeck.app
          lipo -archs "$APP/Contents/MacOS/MacAppControlDeck"
          ./Build/verify-signing.sh "$APP"
          grep -q edSignature BuildOutput/release/universal/appcast.xml
          echo "appcast 已签名，架构与签名校验通过"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: release-${{ env.RELEASE_TAG || github.ref_name }}
          path: BuildOutput/release/universal/*

      - name: 发布 Release
        if: env.RELEASE_TAG != '' && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT=BuildOutput/release/universal
          gh release create "$RELEASE_TAG" \
            "$OUT"/MacAppControlDeck-*.zip \
            "$OUT"/*.dmg \
            "$OUT/appcast.xml" \
            "$OUT/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
