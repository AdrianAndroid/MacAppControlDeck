<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="副屏">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="screen-version" content="%%SCREEN_VERSION%%">
<title>副屏 · 时钟与月历</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --ink: #fff;
    --muted: #8e8e93;
    --accent: #ff3b30;
    --second: #ff9f0a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    position: fixed; inset: 0; overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  #frame {
    --scale: 1;
    --dock-h: 120px;
    --u: calc(clamp(3.2px, 1.55vmin, 6.4px) * var(--scale));
    /* 视口内边距：Mac 端可分别设置上 / 右 / 下 / 左，默认 0 即铺满视口。
       不再自动叠加 safe-area：刘海/圆角留白用内边距手动加，0 就是真正的 0。 */
    --vp-top: 0px; --vp-right: 0px; --vp-bottom: 0px; --vp-left: 0px;
    position: fixed; inset: 0;
    padding: var(--vp-top) var(--vp-right) var(--vp-bottom) var(--vp-left);
    display: flex;
    cursor: default;
  }
  #frame[data-size="s"] { --scale: .82; }
  #frame[data-size="m"] { --scale: 1; }
  #frame[data-size="l"] { --scale: 1.18; }

  /* 走查用视口外框：绝对定位 + inset 阴影，不占 margin/padding、不改布局、不吃点击 */
  #frame[data-border="on"]::after {
    content: '';
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px #00e5ff;
    pointer-events: none;
    z-index: 9999;
  }

  .stage {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: calc(var(--u) * 2.2);
    min-width: 0; min-height: 0;
  }
  .col {
    min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    /* 主内容区与底部固定卡片之间留一段间距，卡片不贴住上半部分。 */
    gap: calc(var(--u) * 1.6);
  }
  .col-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  /* 三栏底栏等高、底边对齐；栏内卡片撑满 dock，形成统一高度的卡片。 */
  .col-dock {
    flex: 0 0 var(--dock-h); height: var(--dock-h); min-height: 0;
    display: flex;
  }
  .clock-col { flex: 0 0 30%; }
  .cal-col { flex: 1 1 auto; }
  .wx-col { flex: 0 0 auto; }

  /* 三栏共用同一套头部节奏：kicker + 1px 分隔线。 */
  .kicker {
    color: var(--muted);
    font-size: calc(var(--u) * 1.85);
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 0 auto;
  }
  .kicker.right { text-align: right; }
  .kicker.center { text-align: center; }
  .rule {
    flex: 0 0 auto;
    height: 1px;
    background: rgba(255, 255, 255, .14);
    margin: calc(var(--u) * 1.1) 0 calc(var(--u) * 1.7);
  }

  /* 表盘铺满主区，四周留白在 canvas 里按 --u 计算（见 drawDial），
     这样任何宽高比下圆盘都不会贴到卡片边框。 */
  .clock {
    flex: 1 1 auto;
    min-width: 0; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .clock canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 月历主区贴顶填充；倒计时独立放入固定底栏。 */
  .cal-main { min-height: 0; }
  .cal-panel {
    flex: 1 1 auto;
    min-height: 0; min-width: 0;
    display: flex; flex-direction: column;
    padding: 0;
  }
  .cal {
    flex: 1 1 auto;
    height: 100%;
    min-height: 0; min-width: 0;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: calc(var(--u) * 1.2) 0 calc(var(--u) * .2);
  }
  .mon {
    display: flex; align-items: baseline; justify-content: center;
    gap: calc(var(--u) * 1.4);
    margin-bottom: calc(var(--u) * 1.6);
  }
  .mon .title {
    color: var(--accent);
    font-size: 2.6vw;
    font-weight: 700;
    letter-spacing: .11em;
    line-height: 1;
    border: 0; background: none; padding: 0;
    font-family: inherit;
    cursor: pointer;
  }
  .mon .year {
    color: var(--muted);
    font-size: 1.5vw;
    letter-spacing: .1em;
    font-variant-numeric: tabular-nums;
  }
  .nav {
    appearance: none; border: 0; background: none;
    color: rgba(255, 255, 255, .38);
    font-size: 2vw;
    line-height: 1; padding: calc(var(--u) * .5) calc(var(--u) * .9);
    font-family: inherit; cursor: pointer;
    transition: color .2s;
  }
  .nav:active { color: var(--ink); }
  .dow, .grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
  .dow {
    color: var(--muted);
    font-size: calc(var(--u) * 2.2);
    letter-spacing: .05em;
    text-align: center;
    margin-bottom: calc(var(--u) * .8);
  }
  .grid {
    grid-template-rows: repeat(5, minmax(0, 1fr));
    flex: 1 1 0;
    min-height: 0;
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--u) * 2.8);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    min-width: 0;
  }
  .cell span {
    display: grid; place-items: center;
    width: 1.9em; height: 1.9em;
    border-radius: 999px;
  }
  .cell.today span {
    background: var(--accent);
    color: #000;
    font-weight: 700;
  }
  .cell.blank span { visibility: hidden; }

  /* ---- 下班倒计时：月历底部，单一结构；放不下只等比缩小 ---- */
  /* 月历网格铺满卡片高度：原来 42vh 的封顶会在 5 行的月份下面留出一大块空白。 */
  .grid { row-gap: calc(var(--u) * .9); }
  .cd-dock { --cd-scale: 1; }
  .cd {
    flex: 0 0 auto; display: none; align-items: center;
    max-width: 100%; overflow: hidden;
    gap: calc(var(--u) * 2 * var(--cd-scale));
    padding: calc(var(--u) * 1.3 * var(--cd-scale)) calc(var(--u) * 1.6 * var(--cd-scale));
    border-radius: calc(var(--u) * 2.4 * var(--cd-scale));
    background: rgba(255, 255, 255, .045);
    border: 1px solid rgba(255, 255, 255, .07);
  }
  .cd.on { display: flex; }
  .cd-icon { flex: 0 0 auto; position: relative;
             width: calc(var(--u) * 6.8 * var(--cd-scale));
             height: calc(var(--u) * 6.8 * var(--cd-scale)); }
  .cd-layer { position: absolute; inset: 0; opacity: 0; transform: scale(.94);
              transition: opacity .4s ease, transform .4s ease; }
  .cd-layer.on { opacity: 1; transform: scale(1); }
  .cd-layer svg { width: 100%; height: 100%; display: block; }
  .cd-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
             gap: calc(var(--u) * .7 * var(--cd-scale)); }
  .cd-label { font-size: calc(var(--u) * 1.7 * var(--cd-scale)); letter-spacing: .16em;
              color: var(--muted); line-height: 1.1; white-space: nowrap; }
  .cd-time { font-size: calc(var(--u) * 4.8 * var(--cd-scale)); line-height: 1.05; font-weight: 600;
             font-variant-numeric: tabular-nums; letter-spacing: .03em;
             white-space: nowrap; }
  .cd-meta { font-size: calc(var(--u) * 1.6 * var(--cd-scale)); color: var(--muted); line-height: 1.15;
             font-variant-numeric: tabular-nums; margin-top: calc(var(--u) * .3 * var(--cd-scale));
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (min-width: 1100px) { .cd-time { font-size: calc(var(--u) * 5.6 * var(--cd-scale)); } }
  .cd-progress { flex: 0 0 auto; position: relative; margin-left: calc(var(--u) * .9 * var(--cd-scale));
                 width: calc(var(--u) * 4.8 * var(--cd-scale));
                 height: calc(var(--u) * 4.8 * var(--cd-scale));
                 display: grid; place-items: center; color: var(--ink); }
  .cd-progress svg { width: 100%; height: 100%; display: block; }
  .cd-pct { position: absolute; font-size: calc(var(--u) * 1.35 * var(--cd-scale)); font-weight: 600;
            font-variant-numeric: tabular-nums; color: var(--ink); }
  .cd[data-phase="before"] .cd-time { color: var(--muted); }
  .cd[data-phase="after"] .cd-time { color: #34c759; }
  .cd[data-phase="before"] .cd-progress { visibility: hidden; }
  .cd[data-phase="after"] .cd-progress { visibility: hidden; }

  /* ---- 桌宠：固定底栏，本地 SVG 帧动画，左右游走 ---- */
  .cd-dock { display: flex; align-items: stretch; }
  .cd-dock .cd { width: 100%; align-self: stretch; }
  .pet-dock { display: flex; align-items: stretch; }
  #frame[data-pet="off"] .pet-dock { display: none; }
  .pet-box {
    position: relative; flex: 1 1 auto; overflow: hidden;
    /* 不画自己的背景和边框，只保留外框（.pet-dock），避免双层边框 */
  }
  .pet-walker {
    position: absolute; left: 0; bottom: calc(var(--u) * 1.6);
    width: calc(var(--u) * 11); height: calc(var(--u) * 8.25);
    will-change: transform;
  }
  .pet-sprite { width: 100%; height: 100%; transform-origin: center; }
  .pet-sprite svg { width: 100%; height: 100%; display: block; }
  /* 肢体与道具常驻 DOM：只切 data-frame / data-state，绝不重建 SVG（手机端重建会掉帧） */
  .pet-sprite .legs-b { display: none; }
  .pet-sprite[data-frame="1"] .legs-a { display: none; }
  .pet-sprite[data-frame="1"] .legs-b { display: block; }
  .pet-sprite .prop { display: none; }
  .pet-sprite[data-state="sleep"] .prop-sleep,
  .pet-sprite[data-state="rain"] .prop-rain,
  .pet-sprite[data-state="cold"] .prop-cold,
  .pet-sprite[data-state="hot"] .prop-hot,
  .pet-sprite[data-state="packup"] .prop-packup,
  .pet-sprite[data-state="celebrate"] .prop-celebrate { display: block; }
  /* 全部动效只用 transform / opacity，交给合成器，不触发布局 */
  .pet-sprite .zzz { animation: pet-zzz 2.1s ease-out infinite; }
  .pet-sprite .zzz.z2 { animation-delay: .7s; }
  .pet-sprite .zzz.z3 { animation-delay: 1.4s; }
  .pet-sprite .drop { animation: pet-drop .9s linear infinite; }
  .pet-sprite .drop.d2 { animation-delay: .22s; }
  .pet-sprite .drop.d3 { animation-delay: .44s; }
  .pet-sprite .drop.d4 { animation-delay: .66s; }
  .pet-sprite .umbrella { animation: pet-umbrella 3s ease-in-out infinite; transform-box: view-box; }
  .pet-sprite .umbrella { rotate: -16deg; }
  .pet-sprite .watch-hand { animation: pet-watch 6s linear infinite; }
  .pet-sprite .star { animation: pet-star 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .pet-sprite .star.s2 { animation-delay: .3s; }
  .pet-sprite .star.s3 { animation-delay: .6s; }
  .pet-sprite .star.s4 { animation-delay: .9s; }
  .pet-sprite .sweat { opacity: .55; animation: pet-sweat 2s ease-in-out infinite; }
  .pet-sprite .pet-body { transform-box: fill-box; transform-origin: center bottom; }
  .pet-sprite[data-state="sleep"] .pet-body { transform: translateY(1.5px) scaleY(.9); }
  .pet-sprite[data-state="cold"] .pet-body { animation: pet-shiver .18s steps(2, end) infinite; }
  .pet-sprite[data-state="celebrate"] .pet-body { animation: pet-jump .6s ease-in-out infinite; }
  @keyframes pet-zzz {
    0% { opacity: 0; transform: translate(0, 3px); }
    25% { opacity: .95; }
    60% { opacity: .8; }
    100% { opacity: 0; transform: translate(2px, -4px); }
  }
  @keyframes pet-drop {
    0% { opacity: 0; transform: translateY(-3px); }
    30% { opacity: .75; }
    100% { opacity: 0; transform: translateY(9px); }
  }
  @keyframes pet-umbrella {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes pet-watch { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pet-star {
    0%, 100% { opacity: 0; transform: scale(.6); }
    50% { opacity: 1; transform: scale(1); }
  }
  @keyframes pet-sweat {
    0% { opacity: .55; transform: translateY(-1px); }
    50% { opacity: .95; transform: translateY(3px); }
    100% { opacity: .55; transform: translateY(-1px); }
  }
  @keyframes pet-shiver {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(.7px); }
  }
  @keyframes pet-jump {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pet-sprite .pet-body, .pet-sprite .prop, .pet-sprite .prop * { animation: none !important; }
  }
  .pet-caption {
    position: absolute; right: calc(var(--u) * 1.4); bottom: calc(var(--u) * .8);
    display: flex; gap: calc(var(--u) * .9); align-items: baseline;
    color: var(--muted); font-size: calc(var(--u) * 1.65);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pet-caption #petName { color: rgba(255, 255, 255, .82); }
  .pet-caption #petNext:empty { display: none; }

  /* ---- 动图：14 个场景共用的一组 keyframes ---- */
  .cd-icon .sweep { animation: cd-sweep 8s linear infinite; transform-origin: 16px 12px; }
  .cd-icon .sweep.slow { animation-duration: 48s; }
  .cd-icon .float { animation: cd-float calc(2.8s * var(--cd-speed, 1)) ease-in-out infinite; }
  .cd-icon .bob { animation: cd-bob calc(1.1s * var(--cd-speed, 1)) ease-in-out infinite; }
  .cd-icon .steam { animation: cd-steam calc(2.2s * var(--cd-speed, 1)) ease-in-out infinite; }
  .cd-icon .steam.s2 { animation-delay: .55s; }
  .cd-icon .steam.s3 { animation-delay: 1.1s; }
  .cd-icon .tick1 { animation: cd-tick calc(1.5s * var(--cd-speed, 1)) infinite; }
  .cd-icon .tick2 { animation: cd-tick calc(1.5s * var(--cd-speed, 1)) infinite .25s; }
  .cd-icon .tick3 { animation: cd-tick calc(1.5s * var(--cd-speed, 1)) infinite .5s; }
  .cd-icon .swing { animation: cd-swing calc(2.6s * var(--cd-speed, 1)) ease-in-out infinite; transform-origin: 12.3px 12.6px; }
  .cd-icon .flip { animation: cd-flip calc(6s * var(--cd-speed, 1)) ease-in-out infinite; transform-origin: 16px 16px; }
  .cd-icon .fall { animation: cd-fall calc(2s * var(--cd-speed, 1)) linear infinite; }
  .cd-icon .rise { animation: cd-rise calc(2.4s * var(--cd-speed, 1)) ease-in-out infinite; }
  .cd-icon .rise.d2 { animation-delay: .5s; }
  .cd-icon .pop { animation: cd-pop calc(2.4s * var(--cd-speed, 1)) ease-in-out infinite; transform-origin: 24.6px 18.4px; }
  .cd-icon .grow1 { animation: cd-grow calc(4s * var(--cd-speed, 1)) ease-in-out infinite; transform-origin: left center; }
  .cd-icon .grow2 { animation: cd-grow calc(4s * var(--cd-speed, 1)) ease-in-out infinite 1s; transform-origin: left center; }
  .cd-icon .grow3 { animation: cd-grow calc(4s * var(--cd-speed, 1)) ease-in-out infinite 2s; transform-origin: left center; }
  .cd-icon .fill { animation: cd-fill calc(3s * var(--cd-speed, 1)) ease-in-out infinite; transform-origin: bottom center; }
  .cd-icon .spin { animation: cd-sweep calc(2.4s * var(--cd-speed, 1)) linear infinite; transform-origin: 16px 15px; }
  .cd-icon .page { animation: cd-page calc(4s * var(--cd-speed, 1)) ease-in-out infinite; transform-origin: 24px 12px; }
  .cd-icon .print { animation: cd-print calc(3s * var(--cd-speed, 1)) ease-in-out infinite; }
  .cd-icon .glow { animation: cd-glow calc(2.4s * var(--cd-speed, 1)) ease-in-out infinite; }
  .cd-icon .note1 { animation: cd-note calc(2.6s * var(--cd-speed, 1)) ease-in-out infinite; }
  .cd-icon .note2 { animation: cd-note calc(2.6s * var(--cd-speed, 1)) ease-in-out infinite .9s; }
  .cd-icon .sway { animation: cd-sway calc(3.2s * var(--cd-speed, 1)) ease-in-out infinite; transform-origin: 16px 22px; }
  .cd-icon .gait-a { animation: cd-gait-a .7s steps(1) infinite; }
  .cd-icon .gait-b { animation: cd-gait-b .7s steps(1) infinite; }
  @keyframes cd-sweep { to { transform: rotate(360deg); } }
  @keyframes cd-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.7px); } }
  @keyframes cd-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.8px); } }
  @keyframes cd-steam { 0% { opacity: .1; transform: translateY(1.6px); } 45% { opacity: .85; transform: translateY(-1.8px); } 100% { opacity: .05; transform: translateY(-4px); } }
  @keyframes cd-tick { 0%, 100% { transform: translateY(0); opacity: .55; } 40% { transform: translateY(1.2px); opacity: 1; } }
  @keyframes cd-swing { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
  @keyframes cd-flip { 0%, 42% { transform: rotate(0deg); } 52%, 92% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
  @keyframes cd-fall { 0% { transform: translateY(0) scaleY(.5); opacity: .9; } 80% { transform: translateY(4.4px) scaleY(1); opacity: .9; } 100% { transform: translateY(4.6px) scaleY(.2); opacity: 0; } }
  @keyframes cd-rise { 0%, 100% { transform: translateY(1.2px); opacity: .55; } 50% { transform: translateY(-1.2px); opacity: 1; } }
  @keyframes cd-pop { 0%, 60%, 100% { transform: scale(0); opacity: 0; } 70%, 90% { transform: scale(1); opacity: 1; } }
  @keyframes cd-grow { 0%, 8% { transform: scaleX(0); opacity: .2; } 40%, 80% { transform: scaleX(1); opacity: 1; } 95%, 100% { transform: scaleX(0); opacity: .2; } }
  @keyframes cd-fill { 0%, 10% { transform: scaleY(.1); } 70%, 90% { transform: scaleY(1); } 100% { transform: scaleY(.1); } }
  @keyframes cd-page { 0%, 55% { transform: rotate(0deg); } 70%, 100% { transform: rotate(-24deg); } }
  @keyframes cd-print { 0%, 100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(-1.6px); opacity: 1; } }
  @keyframes cd-glow { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes cd-note { 0%, 100% { transform: translateY(0); opacity: .3; } 50% { transform: translateY(-2px); opacity: 1; } }
  @keyframes cd-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes cd-gait-a { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes cd-gait-b { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .cd-icon * { animation: none !important; }
    .cd-layer { transition: none; }
    .cd-icon .gait-b { display: none; }
  }

  /* ---- 天气：城市 / 概览 / 预报表（MagicMirror 右上角结构）---- */
  .wx-col { gap: 0; overflow: hidden; }
  .wx-status {
    display: none;
    color: #ff9f0a;
    font-size: calc(var(--u) * 2.4);
    padding-bottom: calc(var(--u) * .8);
  }
  #frame[data-weather="error"] .wx-status { display: block; }
  .wx { display: none; min-width: 0; }
  .wx-now { flex: 0 0 auto; flex-direction: column; }
  .wx-block { display: none; flex: 0 0 auto; margin-top: calc(var(--u) * 1.6); }
  #frame[data-weather="on"] .wx-now { display: flex; }
  #frame[data-weather="on"] .wx-block { display: block; }
  #frame[data-weather="off"] .wx-col { display: none; }

  .wx-meta {
    display: flex; justify-content: space-between;
    gap: calc(var(--u) * 1.2);
    color: var(--muted);
    font-size: calc(var(--u) * 2.3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .wx-hero {
    display: flex; align-items: center; justify-content: flex-end;
    gap: calc(var(--u) * 1.2);
    margin-top: calc(var(--u) * .8);
  }
  .wx-icon {
    flex: 0 0 auto;
    width: calc(var(--u) * 9);
    height: calc(var(--u) * 9);
    color: var(--ink);
  }
  .wx-icon svg { width: 100%; height: 100%; display: block; }

  /* 主天气图标：Meteocons Monochrome 动画 SVG；小图标仍用静态 weatherIcon()。 */
  .wx-icon svg.wx-asset { filter: invert(1); }
  .wx-icon svg.wx-asset-static { color: var(--ink); }
  .wx-temp {
    margin-left: auto;
    font-size: calc(var(--u) * 7.4);
    font-weight: 200;
    line-height: .95;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .wx-feels {
    text-align: right;
    color: var(--muted);
    font-size: calc(var(--u) * 3);
    font-variant-numeric: tabular-nums;
    margin-top: calc(var(--u) * .2);
    white-space: nowrap;
  }
  .wx-feels b { color: var(--ink); font-weight: 400; }

  /* 未来几小时：两行紧凑条（时间 / 图标+温度），不额外占用太多高度。 */
  .wx-hours {
    display: none;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    column-gap: calc(var(--u) * .4);
    border-top: 1px solid rgba(255, 255, 255, .12);
    margin-top: calc(var(--u) * 1.2);
    padding-top: calc(var(--u) * .9);
  }
  #frame[data-weather="on"] .wx-hours { display: grid; }
  .wx-hours[hidden] { display: none !important; }
  .wx-hour {
    display: flex; flex-direction: column; align-items: center;
    gap: calc(var(--u) * .3);
    min-width: 0;
  }
  .wx-hour .t {
    color: var(--muted);
    font-size: calc(var(--u) * 2.1);
    white-space: nowrap;
  }
  .wx-hour .v {
    display: flex; align-items: center;
    gap: calc(var(--u) * .3);
    font-size: calc(var(--u) * 2.3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .wx-hour .v svg { width: calc(var(--u) * 3); height: calc(var(--u) * 3); display: block; }

  .wx-block .kicker { margin-top: calc(var(--u) * 1.2); }

  .wx-days { display: none; }
  #frame[data-weather="on"] .wx-days {
    display: flex; flex-direction: column;
    gap: calc(var(--u) * .7);
  }
  .wx-day {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto auto;
    align-items: center;
    column-gap: calc(var(--u) * 1.4);
    font-size: calc(var(--u) * 2.5);
    font-variant-numeric: tabular-nums;
  }
  .wx-day .d { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wx-day .i {
    width: calc(var(--u) * 3.6);
    height: calc(var(--u) * 3.6);
    display: block;
    color: var(--ink);
  }
  .wx-day .i svg { width: 100%; height: 100%; display: block; }
  .wx-day .hi { text-align: right; min-width: 2.5em; }
  .wx-day .lo { text-align: right; min-width: 2.5em; color: var(--muted); }
  /* 天气卡底栏只有一行：城市 · 更新时间 · 数据源，同字号同色，像一句署名。 */
  .wx-foot {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: calc(var(--u) * 2.05);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wx-foot a { color: inherit; text-decoration: none; }
  .wx-foot b { color: #ff9f0a; font-weight: 500; }
  .wx-dock {
    flex: 0 0 auto; height: auto;
    display: flex; align-items: baseline;
    margin-top: calc(var(--u) * .9);
    overflow: hidden;
  }

  .chrome {
    position: fixed;
    left: 50%;
    top: calc(var(--vp-top) + var(--u) * 2);
    transform: translate(-50%, calc(var(--u) * -2));
    display: flex; align-items: center; gap: calc(var(--u) * 1.4);
    padding: calc(var(--u) * 1.6) calc(var(--u) * 2);
    border-radius: 999px;
    background: rgba(28, 28, 30, .88);
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .24s ease, transform .24s ease;
    z-index: 10;
  }
  #frame.ui .chrome {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }
  .tool {
    appearance: none; border: 0;
    background: none; color: rgba(255, 255, 255, .72);
    font-family: inherit; font-size: calc(var(--u) * 2.7);
    padding: calc(var(--u) * 1.3) calc(var(--u) * 2.2);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tool.on { color: var(--ink); background: rgba(255, 255, 255, .1); }
  #refreshHint { color: #34c759; font-weight: 600; }
  #refreshHint:empty { display: none; }

  @media (orientation: landscape) {
    /* 横屏三栏严格等宽：时钟 | 月历 | 天气。 */
    .stage {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: 1fr;
      gap: calc(var(--u) * 2.4);
      align-items: stretch;
    }
    .clock-col, .cal-col, .wx-col { grid-row: 1; }
    .clock-col { grid-column: 1; }
    .cal-col { grid-column: 2; }
    .wx-col { grid-column: 3; }
    #frame[data-weather="off"] .stage { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #frame[data-weather="off"] .cal-col { grid-column: 2; }
    .cell { font-size: calc(var(--u) * 3); }
    /* 横屏四个模块：时钟 / 月历 / 倒计时 / 天气各自成框。 */
    .stage { gap: calc(var(--u) * 1.6); }
    #frame[data-frames="on"] .clock-main,
    #frame[data-frames="on"] .wx-col,
    #frame[data-frames="on"] .cal-panel,
    #frame[data-frames="on"] .pet-dock,
    #frame[data-frames="on"] .cd {
      border: 1px solid rgba(255, 255, 255, var(--frame-strength, .16));
      border-radius: calc(var(--u) * 2.4);
    }
    #frame[data-frames="on"] .clock-main,
    #frame[data-frames="on"] .wx-col,
    #frame[data-frames="on"] .cal-panel {
      padding: calc(var(--u) * .9) calc(var(--u) * 1.3);
    }
    /* 时钟卡不留内边距：四周留白统一由表盘自身 margin（2.4u）决定，保证四边等距。 */
    #frame[data-frames="on"] .clock-main { padding: 0; }
    #frame[data-frames="on"] .pet-dock { padding: calc(var(--u) * .5); }
    /* 加框后天气列少 20px 左右，收紧内部行距避免压出框外。 */
    #frame[data-frames="on"] .wx-hours { margin-top: calc(var(--u) * .4); padding-top: calc(var(--u) * .4); }
    #frame[data-frames="on"] .wx-foot { margin-top: calc(var(--u) * .1); }
    #frame[data-frames="on"] .wx-days { gap: calc(var(--u) * .2); }
    #frame[data-frames="on"] .cd {
      padding: calc(var(--u) * 1.3 * var(--cd-scale)) calc(var(--u) * 1.6 * var(--cd-scale));
    }
  }
  @media (orientation: portrait) {
    /* 竖屏：时钟 → 天气（含小时条/预报）→ 月历，压缩天气块给日历留足行高。 */
    .stage { flex-direction: column; gap: calc(var(--u) * 1.8); }
    .col { gap: 0; }
    .col-dock { flex-basis: auto; height: auto; }
    .pet-dock { display: none; }
    .clock-col { flex: 0 0 20%; }
    #frame[data-weather="off"] .clock-col { flex-basis: 44%; }
    .mon { gap: 1.4vw; margin-bottom: calc(var(--u) * 1); }
    .mon .title { font-size: calc(6.4vw * var(--scale)); }
    .mon .year { font-size: calc(3.2vw * var(--scale)); }
    .nav { font-size: calc(4vw * var(--scale)); padding: .8vw 1.2vw; }
    .dow { font-size: calc(3.2vw * var(--scale)); }
    .cell { font-size: calc(4vw * var(--scale)); }
    .grid { row-gap: calc(var(--u) * .5); }
    .cell span { width: 1.5em; height: 1.5em; }
    .rule { margin: calc(var(--u) * .8) 0 calc(var(--u) * 1.2); }
    .wx-icon { width: calc(var(--u) * 7); height: calc(var(--u) * 7); }
    .wx-temp { font-size: calc(var(--u) * 5.8); }
    .wx-feels { font-size: calc(var(--u) * 2.5); }
    .wx-meta { font-size: calc(var(--u) * 2.1); }
    .wx-block .kicker { margin-top: calc(var(--u) * .6); }
    .wx-hours { margin-top: calc(var(--u) * .8); padding-top: calc(var(--u) * .6); }
    .wx-hour .t { font-size: calc(var(--u) * 1.9); }
    .wx-hour .v { font-size: calc(var(--u) * 2.1); }
    .wx-hour .v svg { width: calc(var(--u) * 2.8); height: calc(var(--u) * 2.8); }
    #frame[data-weather="on"] .wx-days { gap: calc(var(--u) * .3); }
    .wx-day { font-size: calc(var(--u) * 2.1); column-gap: calc(var(--u) * .8); }
    .wx-day .i { width: calc(var(--u) * 2.9); height: calc(var(--u) * 2.9); }
    .wx-foot { font-size: calc(var(--u) * 1.9); margin-top: calc(var(--u) * .6); }
  }
  /* 平板/桌面窗口等大屏上，别让月历网格无限拉伸；保持接近方形单元格并整体居中。 */
  @media (min-height: 700px) {
    .grid { max-height: max(calc(var(--u) * 34), 46vh); }
  }
  @media (max-height: 430px) {
    #frame { --dock-h: 92px; }
    .mon { margin-bottom: calc(var(--u) * .8); }
    .dow { margin-bottom: calc(var(--u) * .4); }
    /* 很矮的横屏：压缩天气主视觉和预报行，给小时条腾空间。 */
    .wx-icon { width: calc(var(--u) * 7.6); height: calc(var(--u) * 7.6); }
    .wx-temp { font-size: calc(var(--u) * 6.6); }
    .wx-feels { font-size: calc(var(--u) * 2.7); }
    #frame[data-weather="on"] .wx-days { gap: calc(var(--u) * .4); }
    .wx-day { font-size: calc(var(--u) * 2.3); column-gap: calc(var(--u) * 1); }
    .wx-day .i { width: calc(var(--u) * 3); height: calc(var(--u) * 3); }
    .wx-hour .v svg { width: calc(var(--u) * 2.7); height: calc(var(--u) * 2.7); }
  }
</style>
</head>
<body>
<div id="frame" data-size="m" data-weather="off">
  <div class="stage">
    <section class="col clock-col">
      <div class="col-main clock-main">
        <div class="clock">
          <canvas id="dial" aria-label="模拟时钟"></canvas>
        </div>
      </div>
      <section class="col-dock pet-dock" id="petDock">
        <div class="pet-box" id="petBox">
          <div class="pet-walker" id="petWalker">
            <div class="pet-sprite" id="petSprite"></div>
          </div>
          <div class="pet-caption">
            <span id="petName">像素猫</span><span id="petNext"></span>
          </div>
        </div>
      </section>
    </section>

    <section class="col wx-col">
      <div class="col-main wx-main">
        <div class="wx-status" id="wxStatus">天气加载中…</div>
        <div class="wx wx-now" id="wxNow">
          <div class="wx-meta" id="wxMeta"></div>
          <div class="wx-hero">
            <span class="wx-icon" id="wxIcon"></span>
            <span class="wx-temp" id="wxTemp">--°</span>
          </div>
          <div class="wx-feels" id="wxFeels"></div>
        </div>
        <div class="wx-hours" id="wxHours" hidden></div>
        <div class="wx-block">
          <div class="kicker">WEATHER FORECAST</div>
          <div class="rule"></div>
          <div class="wx-days" id="wxDays"></div>
        </div>
      </div>
      <section class="col-dock wx-dock">
        <div class="wx-foot" id="wxFoot"></div>
      </section>
    </section>

    <section class="col cal-col">
      <div class="col-main cal-main">
        <div class="cal-panel">
          <div class="cal">
            <div class="mon">
              <button class="nav" id="prev" aria-label="上个月">‹</button>
              <button class="title" id="month" aria-label="回到当月"></button>
              <span class="year" id="year"></span>
              <button class="nav" id="next" aria-label="下个月">›</button>
            </div>
            <div class="dow" aria-hidden="true">
              <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
            </div>
            <div class="grid" id="grid" role="grid" aria-label="当月月历"></div>
          </div>
        </div>
      </div>
      <section class="col-dock cd-dock" id="cdDock">
        <section class="cd" id="cd" data-phase="working">
          <div class="cd-icon" id="cdIcon">
            <div class="cd-layer" id="cdLayerA"></div>
            <div class="cd-layer" id="cdLayerB"></div>
          </div>
          <div class="cd-body">
            <div class="cd-label" id="cdLabel">距下班</div>
            <div class="cd-time" id="cdTime">--:--:--</div>
            <div class="cd-meta" id="cdMeta"></div>
          </div>
          <div class="cd-progress" id="cdProgress" aria-hidden="true">
            <svg viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2.6"/>
              <circle id="cdArc" cx="18" cy="18" r="15" fill="none" stroke="currentColor" stroke-width="2.6"
                      stroke-linecap="round" transform="rotate(-90 18 18)"
                      stroke-dasharray="94.25" stroke-dashoffset="0"/>
            </svg>
            <span class="cd-pct" id="cdPct">100%</span>
          </div>
        </section>
      </section>
    </section>
  </div>
  <div class="chrome" id="chrome">
    <button class="tool" id="refresh" aria-label="刷新数据">↻</button>
    <span id="refreshHint"></span>
    <button class="tool" id="fullscreen" hidden>全屏</button>
  </div>
</div>
<script>
(function () {
  var frame = document.getElementById('frame');
  var canvas = document.getElementById('dial');
  var ctx = canvas.getContext('2d');
  var grid = document.getElementById('grid');
  var monthLabel = document.getElementById('month');
  var yearLabel = document.getElementById('year');
  var fullscreenBtn = document.getElementById('fullscreen');
  var refreshBtn = document.getElementById('refresh');
  var refreshHint = document.getElementById('refreshHint');
  var wxStatus = document.getElementById('wxStatus');
  var wxMeta = document.getElementById('wxMeta');
  var wxIcon = document.getElementById('wxIcon');
  var lastHeroIconCode = null;
  var wxTemp = document.getElementById('wxTemp');
  var wxFeels = document.getElementById('wxFeels');
  var wxHours = document.getElementById('wxHours');
  var wxFoot = document.getElementById('wxFoot');
  var wxDays = document.getElementById('wxDays');
  var MONTHS = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE',
                'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
  var WEEKDAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var MONTHS_SHORT = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN',
                      'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  // ---- Mac 墙钟 ----
  // 手机日期/时区可能与 Mac 不同；这里把 Mac 的 epoch 平移到“Mac 本地墙钟”，
  // 之后统一用 UTC getter 读取年月日时分秒。
  var macEpochSeconds = Date.now() / 1000;
  var macOffsetMinutes = -new Date().getTimezoneOffset();
  var macFetchedAt = Date.now();
  var screenVersionMeta = document.querySelector('meta[name="screen-version"]');
  var screenVersion = screenVersionMeta ? screenVersionMeta.content : '';

  function queryParam(name) {
    var found = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return found ? decodeURIComponent(found[1]) : '';
  }
  // 事件基线：重载后的页面从 URL 携带的 revision 继续，避免重复重载循环。
  // 首次打开（无 rev）时为 0；第一次 long-poll 会把基线对齐到服务端当前值。
  var screenEventRevision = parseInt(queryParam('rev'), 10) || 0;
  var eventRevisionPrimed = queryParam('rev') !== '';

  function macWall() {
    var ms = (macEpochSeconds + macOffsetMinutes * 60) * 1000 + (Date.now() - macFetchedAt);
    return new Date(ms);
  }

  function loadMacTime() {
    fetch('/api/time', { cache: 'no-store' }).then(function (response) {
      if (!response.ok) { throw new Error('HTTP ' + response.status); }
      return response.json();
    }).then(function (data) {
      if (!data || typeof data.epoch !== 'number') { return; }
      if (data.screenVersion && screenVersion && data.screenVersion !== screenVersion) {
        location.replace('/screen/?v=' + encodeURIComponent(data.screenVersion) + '&t=' + Date.now());
        return;
      }
      var previous = macWall();
      var wasCurrentMonth = viewYear === previous.getUTCFullYear() &&
                            viewMonth === previous.getUTCMonth();
      macEpochSeconds = data.epoch;
      macOffsetMinutes = typeof data.offsetMinutes === 'number' ? data.offsetMinutes : 0;
      macFetchedAt = Date.now();
      var current = macWall();
      if (wasCurrentMonth) {
        viewYear = current.getUTCFullYear();
        viewMonth = current.getUTCMonth();
      }
      drawDial(current);
      renderCalendar();
      petEnv.hour = current.getUTCHours();
      petEnv.weekday = current.getUTCDay();
      petEvaluateBehavior();
    }).catch(function () {});
  }

  // ---- 副屏显示配置：尺寸 / 桌宠 / 常亮，全部由 Mac 端下发 ----
  var displayConfig = { size: 'm', petMode: 'fixed', petId: 'cat', petInterval: 60,
                        keepAwake: true, petSwitchNonce: 0, petVisible: true,
                        petLive: true };
  var displayApplied = false;
  var lastConfigPetId = 'cat';
  var lastPetSwitchNonce = 0;

  function setSize(size) {
    if (size !== 's' && size !== 'l') { size = 'm'; }
    if (frame.dataset.size === size) { return; }
    frame.dataset.size = size;
    drawDial(macWall());
    petMeasure();
  }

  function applyDisplay(data) {
    if (!data) { return; }
    setSize(data.size);
    // 宠物卡片开关：关闭时连底部 dock 一起收起，时钟区顺势变高。
    frame.dataset.pet = data.petVisible === false ? 'off' : 'on';
    // 是否随环境变化；关闭后恒为 idle（等价于旧行为）。
    petState.live = data.petLive !== false;
    petEvaluateBehavior();
    var newMode = data.petMode === 'random' ? 'random' : 'fixed';
    var newId = PET_NAMES[data.petId] ? data.petId : 'cat';
    var newInterval = PET_INTERVALS.indexOf(Number(data.petInterval)) >= 0
      ? Number(data.petInterval) : 60;
    var nonce = Number(data.petSwitchNonce) || 0;

    var firstApply = !displayApplied;
    if (!displayApplied) { displayApplied = true; }
    var idChanged = !firstApply && newId !== lastConfigPetId;
    var intervalChanged = !firstApply && newInterval !== petState.interval;
    var switched = !firstApply && nonce !== lastPetSwitchNonce;
    lastConfigPetId = newId;
    lastPetSwitchNonce = nonce;

    var modeChanged = !firstApply && newMode !== petState.mode;
    petState.mode = newMode;
    petState.interval = newInterval;

    if (newMode === 'random') {
      // 首次进入 / 参数变化 / 手动换宠才重置队列；普通刷新不打断当前随机轮播。
      if (firstApply || switched || idChanged || intervalChanged || modeChanged) {
        petApply(newId);
        petState.queue = [];
        petAdvanceRandom(false);
      } else {
        petRenderCaption();
        petScheduleRandom();
      }
    } else {
      petApply(newId);
      petState.queue = [];
      petState.nextAt = 0;
      petNext.textContent = '';
      if (petRandomTimer) { clearTimeout(petRandomTimer); petRandomTimer = null; }
    }
    applyKeepAwake(data.keepAwake !== false);
  }

  function loadDisplay() {
    fetch('/api/screen/display', { cache: 'no-store' })
      .then(function (response) { if (!response.ok) { throw new Error('HTTP ' + response.status); } return response.json(); })
      .then(function (data) { applyDisplay(data); })
      .catch(function () {});
  }

  // ---- 桌宠：状态化 + 单次渲染（肢体/道具常驻 DOM，只切 data-*）----
  var petBox = document.getElementById('petBox');
  var petWalker = document.getElementById('petWalker');
  var petSprite = document.getElementById('petSprite');
  var petName = document.getElementById('petName');
  var petNext = document.getElementById('petNext');
  var PET_KEYS = ['cat', 'dog', 'robot', 'capybara'];
  var PET_NAMES = { cat: '像素猫', dog: '小狗', robot: '机器人', capybara: '水豚' };
  var PET_INTERVALS = [30, 60, 300, 900];
  // 每种状态的移动速度（px/ms），0 = 原地。
  var PET_SPEED = { idle: .035, packup: .03, hot: .02, rain: 0, cold: 0, sleep: 0, celebrate: 0 };
  // 三个锚点（viewBox 64×48）：head 头顶中心、top 右上方（Zzz）、neck 颈部、watch 身侧（表）。
  var PET_ANCHORS = {
    cat:   { head: [32, 4], top: [45, 7],  neck: [26, 24], watch: [52, 25] },
    dog:   { head: [33, 4], top: [46, 7],  neck: [25, 24], watch: [53, 26] },
    robot: { head: [32, 5], top: [44, 6],  neck: [25, 22], watch: [52, 24] },
    capybara: { head: [32, 6], top: [46, 8], neck: [27, 26], watch: [52, 26] }
  };
  var petRandomTimer = null;
  var petState = {
    mode: 'fixed', id: 'cat', interval: 60, nextAt: 0, queue: [],
    dir: 1, x: 0, frame: 0, lastStep: 0, lastFrame: 0,
    maxX: 0, lastX: null, lastDir: null, walkerW: 0,
    behavior: 'idle', behaviorText: '', live: true
  };
  // 环境数据：由 /api/time、/api/weather、/api/screen/countdown 各自写入，不额外发请求。

    }

    var hours = now.getUTCHours() % 12;
    var minutes = now.getUTCMinutes();
    var seconds = now.getUTCSeconds() + now.getUTCMilliseconds() / 1000;

    hand(cx, cy, (hours + minutes / 60) * 30, R * 0.46, R * 0.055, '#fff');
    hand(cx, cy, (minutes + seconds / 60) * 6, R * 0.68, R * 0.036, '#fff');
    hand(cx, cy, seconds * 6, R * 0.82, R * 0.011, '#ff9f0a');

    ctx.beginPath();
    ctx.fillStyle = '#ff9f0a';
    ctx.arc(cx, cy, R * 0.03, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = '#7a4a00';

    var s = Math.max(0, Math.floor(totalSeconds));

    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    return withSeconds ? cdPad(h) + ':' + cdPad(m) + ':' + cdPad(sec) : cdPad(h) + ':' + cdPad(m);
  }

    if (!cd) { return 0; }

    return Math.round(Math.min(1, Math.max(0, 1 - (cd.progress || 0))) * 100);
  }

  // 单一结构：先按 1.0 渲染，再按可用宽高等比缩小，不换排版
  function cdFit() {
    var dock = document.getElementById('cdDock');
    var card = document.getElementById('cd');
    if (!dock || !card || !cd) { return; }
    var availH = dock.clientHeight;
    if (availH <= 0) { card.classList.remove('on'); return; }
    // 固定底栏内二分找「内容不溢出」的最大缩放：结构不变，只缩尺寸
    var lo = 0.6, hi = 1;
    var fits = false;
    for (var i = 0; i < 7; i++) {
      var mid = (lo + hi) / 2;
      dock.style.setProperty('--cd-scale', mid.toFixed(3));
      var timeEl = document.getElementById('cdTime');
      var metaEl = document.getElementById('cdMeta');
      var okW = card.scrollWidth <= card.clientWidth + 1 &&
                timeEl.scrollWidth <= timeEl.clientWidth + 1 &&
                metaEl.scrollWidth <= metaEl.clientWidth + 1;
      var okH = card.offsetHeight <= availH + 1;
      if (okW && okH) { lo = mid; fits = true; } else { hi = mid; }
    }
    dock.style.setProperty('--cd-scale', lo.toFixed(3));
    card.classList.toggle('on', fits || lo >= 0.6);
  }

  function cdApplyScene() {
    if (!cd) { return; }
    var list = cdScenes[cd.phase] || cdScenes.working;
    var index = 0;
    if (cd.phase === 'working') {
      if (cdOverride.until > Date.now()) {
        index = Math.min(list.length - 1, Math.max(0, cdOverride.index));
      } else {
        index = (Math.floor(cdDaySeconds() / CD.sceneEvery) + cdMacHour()) % list.length;
      }
    }
    var key = cd.phase + ':' + index;
    if (key === cdSceneKey) { return; }
    cdSceneKey = key;
    var a = document.getElementById('cdLayerA');
    var b = document.getElementById('cdLayerB');
    var next = cdLayerOn === 1 ? a : b;
    var prev = cdLayerOn === 1 ? b : a;
    next.innerHTML = '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + list[index] + '</svg>';
    next.classList.add('on');
    prev.classList.remove('on');
    cdLayerOn = cdLayerOn === 1 ? 2 : 1;
  }

  function cdCheckMilestone() {
    if (!cd || cd.phase !== 'working') { cdLastBucket = null; return; }

    var bucket = pct <= 10 ? 10 : pct <= 25 ? 25 : pct <= 50 ? 50 : 100;
    if (cdLastBucket !== null && bucket < cdLastBucket && CD.milestones.indexOf(bucket) >= 0) {

      cdOverride = { until: Date.now() + CD.milestoneHold, index: map[bucket] || 0 };
      cdSceneKey = '';

    '500': 'mist',
    '501': 'fog', '509': 'fog', '514': 'fog', '515': 'fog',
    '502': 'haze', '511': 'haze', '512': 'haze', '513': 'haze',
    '503': 'wind-dust', '504': 'wind-dust', '507': 'wind-dust', '508': 'wind-dust'
  };

  function weatherHeroAsset(code) {
    return WX_HERO_ASSETS[String(code == null ? '' : code)] || null;
  }

  var heroIconToken = 0;
  var heroSvg = null;
  var heroCode = '';
  var reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;

  function applyHeroMotion() {
    if (!heroSvg) { return; }
    try {
      if ((reduceMotion && reduceMotion.matches) || document.visibilityState === 'hidden') {
        heroSvg.pauseAnimations();
      } else {
        heroSvg.unpauseAnimations();
      }
    } catch (e) {}
  }

  function adoptHeroSvg(isStatic) {
    heroSvg = wxIcon.querySelector('svg');
    if (!heroSvg) { return; }
    heroSvg.classList.add(isStatic ? 'wx-asset-static' : 'wx-asset');
    applyHeroMotion();
  }

  function renderHeroFallback(code) {
    heroSvg = null;
    wxIcon.innerHTML = code ? weatherIcon(code) : '';
  }

  // 同一个 icon code 的轮询刷新不重建 DOM，避免动画每 30 秒从头播放。
  function renderHeroIcon(code) {
    var next = code == null ? '' : String(code);
    if (next === lastHeroIconCode) { return; }
    lastHeroIconCode = next;
    heroCode = next;
    var asset = weatherHeroAsset(next);
    var token = ++heroIconToken;
    if (!asset) { renderHeroFallback(next); return; }
    var isStatic = !!(reduceMotion && reduceMotion.matches);
    var variant = isStatic ? 'static-' : '';
    var url = '/screen/icons/' + variant + asset + '.svg?v=' + encodeURIComponent(screenVersion || '0');
    fetch(url, { cache: 'force-cache' }).then(function (response) {
      if (!response.ok) { throw new Error('HTTP ' + response.status); }
      return response.text();
    }).then(function (markup) {
      if (token !== heroIconToken || lastHeroIconCode !== next) { return; }
      wxIcon.innerHTML = markup;
      adoptHeroSvg(isStatic);
    }).catch(function () {
      if (token !== heroIconToken || lastHeroIconCode !== next) { return; }
      renderHeroFallback(next);
    });
  }

  // 减少动态开关变化时重载静态 / 动画版本，避免停在动画的透明帧。
  function reloadHeroForMotionPreference() {
    if (lastHeroIconCode === null) { return; }
    lastHeroIconCode = null;
    renderHeroIcon(heroCode);
  }

  if (reduceMotion) {
    if (reduceMotion.addEventListener) {
      reduceMotion.addEventListener('change', reloadHeroForMotionPreference);
    } else if (reduceMotion.addListener) {
      reduceMotion.addListener(reloadHeroForMotionPreference);
    }
  }

  function dayLabel(dateString) {
    if (!dateString) { return ''; }
    var parts = String(dateString).split('-');
    if (parts.length < 3) { return ''; }
    var dateUTC = Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    var wall = macWall();
    var todayUTC = Date.UTC(wall.getUTCFullYear(), wall.getUTCMonth(), wall.getUTCDate());
    var diff = Math.round((dateUTC - todayUTC) / 86400000);
    if (diff === 0) { return '今天'; }
    if (diff === 1) { return '明天'; }
    if (diff === 2) { return '后天'; }
    return '周' + '日一二三四五六'.charAt(new Date(dateUTC).getUTCDay());
  }

  function formatUpdated(value) {
    if (!value) { return ''; }
    var date = new Date(value);
    if (isNaN(date.getTime())) { return ''; }
    var wall = new Date(date.getTime() + macOffsetMinutes * 60000);
    var hh = String(wall.getUTCHours()).padStart(2, '0');
    var mm = String(wall.getUTCMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  function formatHour(value) {
    if (!value) { return ''; }
    var date = new Date(value);
    if (isNaN(date.getTime())) { return ''; }
    var wall = new Date(date.getTime() + macOffsetMinutes * 60000);
    return wall.getUTCHours() + '时';
  }

  function renderWeather(data) {
    if (weatherErrorTimer) { clearTimeout(weatherErrorTimer); weatherErrorTimer = null; }
    frame.dataset.weather = 'on';
    wxStatus.style.display = '';
    wxStatus.textContent = '';
    var now = data.now || {};
    var today = data.today || {};

    var humidity = now.humidity == null ? '—' : now.humidity + '%';
    var rain = today.precipProbability == null ? '—' : today.precipProbability + '%';
    wxMeta.innerHTML = '<span>湿度 ' + humidity + '</span><span>降水 ' + rain + '</span>';
    renderHeroIcon(now.icon);
    petEnv.precip = today.precipProbability == null ? null : Number(today.precipProbability);
    petEnv.temp = now.temp == null ? null : Number(now.temp);
    petEvaluateBehavior();
    wxTemp.textContent = now.temp == null ? '—' : now.temp + '°';
    wxFeels.innerHTML = now.feelsLike == null ? '' : '体感 <b>' + now.feelsLike + '°</b>';

    var hours = Array.isArray(data.hourly) ? data.hourly : [];
    if (hours.length) {
      var cells = [{ label: '现在', icon: now.icon, temp: now.temp }];
      hours.slice(0, 4).forEach(function (hour) {
        cells.push({ label: formatHour(hour.time), icon: hour.icon, temp: hour.temp });
      });
      wxHours.innerHTML = cells.map(function (cell) {
        return '<div class="wx-hour">' +
          '<div class="t">' + cell.label + '</div>' +
          '<div class="v">' + weatherIcon(cell.icon) +
            '<span>' + (cell.temp == null ? '—' : cell.temp + '°') + '</span>' +
          '</div></div>';
      }).join('');
      wxHours.hidden = false;
    } else {
      wxHours.innerHTML = '';
      wxHours.hidden = true;
    }

    var updated = formatUpdated(data.updatedAt);
    // 底栏单行：城市 · 更新时间 · 数据源（城市用 DOM 赋值，避免注入）。
    wxFoot.innerHTML = '';
    var city = data.city || '';
    if (city) {
      var cityNode = document.createElement('span');
      cityNode.className = 'wx-city';
      cityNode.textContent = city;
      wxFoot.appendChild(cityNode);
      wxFoot.appendChild(document.createTextNode(' · '));
    }
    if (updated) {
      wxFoot.appendChild(document.createTextNode('更新 ' + updated + ' · '));
    }
    var sourceLink = document.createElement('a');
    sourceLink.href = 'https://www.qweather.com';
    sourceLink.target = '_blank';
    sourceLink.rel = 'noreferrer';
    sourceLink.textContent = data.attribution || '和风天气';
    wxFoot.appendChild(sourceLink);
    if (data.stale) {
      wxFoot.appendChild(document.createTextNode(' · '));
      var staleNode = document.createElement('b');
      staleNode.textContent = '已过期';
      wxFoot.appendChild(staleNode);
    }

    var days = Array.isArray(data.daily) ? data.daily.slice(0, 5) : [];
    wxDays.innerHTML = days.map(function (day) {
      var max = day.max == null ? '—' : day.max + '°';
      var min = day.min == null ? '—' : day.min + '°';
      return '<div class="wx-day">' +
        '<div class="d">' + dayLabel(day.date) + '</div>' +
        '<div class="i">' + weatherIcon(day.icon) + '</div>' +
        '<div class="hi">' + max + '</div>' +
        '<div class="lo">' + min + '</div>' +
        '</div>';
    }).join('');
  }

  function renderWeatherError(message) {
    frame.dataset.weather = 'error';
    wxStatus.style.display = '';
    wxStatus.textContent = (message && message !== '天气暂不可用') ? message : '天气加载失败，正在重试…';
    wxHours.hidden = true;
    if (weatherErrorTimer) { clearTimeout(weatherErrorTimer); }
    weatherErrorTimer = setTimeout(function () {
      weatherErrorTimer = null;
      if (document.visibilityState === 'visible') { loadWeather(); }
    }, 8000);
  }

  function clearWeather() {
    if (weatherErrorTimer) { clearTimeout(weatherErrorTimer); weatherErrorTimer = null; }
    frame.dataset.weather = 'off';
    wxStatus.style.display = 'none';
    wxStatus.textContent = '';
    wxMeta.innerHTML = '';
    lastHeroIconCode = null;
    heroCode = '';
    heroIconToken += 1;
    heroSvg = null;
    wxIcon.innerHTML = '';
    wxTemp.textContent = '--°';
    wxFeels.innerHTML = '';
    wxHours.innerHTML = '';
    wxHours.hidden = true;
    wxFoot.innerHTML = '';
    wxDays.innerHTML = '';
  }

  function loadWeather() {
    lastWeatherFetch = Date.now();
    if (frame.dataset.weather === 'error') { wxStatus.textContent = '天气加载中…'; }
    fetch('/api/weather', { cache: 'no-store' }).then(function (response) {
      if (!response.ok) { throw new Error('HTTP ' + response.status); }
      return response.json();
    }).then(function (data) {
      if (data && data.ok) {
        renderWeather(data);
        return;
      }
      if (data && data.reason === 'not-configured') {
        clearWeather();
        return;
      }
      renderWeatherError(data && data.message ? data.message : '');
    }).catch(function () {
      renderWeatherError('');
    });
  }

  function scheduleWeather() {
    if (weatherTimer) { clearInterval(weatherTimer); }
    weatherTimer = setInterval(function () {
      if (document.visibilityState === 'visible') { loadWeather(); }
    }, 30 * 1000);
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      loadMacTime();
      loadWeather();
      loadCountdown();
      loadScreenFrame();
      loadDisplay();
    }
  });
  var eventInFlight = false;
  function hardReload(reason) {
    if (refreshBtn) { refreshBtn.dataset.busy = '1'; refreshBtn.textContent = '…'; }
    if (refreshHint) { refreshHint.textContent = '刷新中…'; }
    keepUIVisible();
    location.replace('/screen/?v=' + encodeURIComponent(screenVersion || '0') +
                     '&rev=' + screenEventRevision + '&t=' + Date.now());
  }
  // 事件轮询只负责「发现变化」，发现后整页重载以应用全部设置（含桌宠配置）。
  function watchScreenEvents() {
    if (eventInFlight) { return; }
    if (document.visibilityState !== 'visible') {
      setTimeout(watchScreenEvents, 2000);
      return;
    }
    eventInFlight = true;
    fetch('/api/screen/events?since=' + screenEventRevision, { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) { throw new Error('HTTP ' + response.status); }
        return response.json();
      })
      .then(function (data) {
        if (!data || typeof data.revision !== 'number') { return; }
        if (data.revision !== screenEventRevision) {
          // 首次打开：服务端可能已有历史 revision，只对齐基线，不触发重载。
          if (!eventRevisionPrimed) {
            eventRevisionPrimed = true;
            screenEventRevision = data.revision;
            return;
          }
          screenEventRevision = data.revision;
          hardReload('event');
        }
      })
      .catch(function () {})
      .finally(function () {
        eventInFlight = false;
        setTimeout(watchScreenEvents, 800);
      });
  }

  // 刷新按钮 = 真正重载整页，重新拉取时间/天气/倒计时/桌宠/外观等全部内容。
  function refreshAll() {
    if (refreshBtn && refreshBtn.dataset.busy === '1') { return; }
    hardReload('manual');
  }
  refreshBtn.addEventListener('click', refreshAll);

  loadMacTime();
  watchScreenEvents();
  setInterval(function () {
    if (document.visibilityState === 'visible') { loadMacTime(); }
  }, 60 * 1000);
  loadWeather();
  scheduleWeather();
  loadCountdown();
  loadScreenFrame();
  loadDisplay();

  // 首次进入短暂展示控制条，提示可点按。
  setTimeout(showUI, 400);
})();
</script>
</body>
</html>
